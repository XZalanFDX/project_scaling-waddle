<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nike – Just Do It</title>
  <link rel="stylesheet" href="css/cover.css" />
  <link rel="icon" href="resc/logowhite.png">
</head>
<body>
  <!-- Videók -->
  <div class="video-bg" id="videoBg">
    <video class="video-slide active" muted autoplay playsinline preload="auto">
      <source src="resc/vid3.mp4" type="video/mp4" />
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Logó -->
  <a class="cover-logo" href="store.html" aria-label="Nike Store">
    <img src="resc/logowhite.png" alt="Nike" />
  </a>

  <!-- Reklámszöveg -->
  <main class="cover-content">
    <h1 class="cover-title">
      <span class="title-line" data-delay="0">JUST</span>
      <span class="title-line" data-delay="1">DO IT</span>
    </h1>
    <a class="cover-btn" href="store.html">
      <span>Tovább az áruházba</span>
    </a>
  </main>
  <div class="slide-dots" id="slideDots"></div>
</body>
</html>
